# Producción. Las imágenes se construyen en GitHub Actions y se publican en GHCR;
# en el servidor solo hace falta: docker compose -f docker-compose.prod.yml pull && up -d
#
# Variables (en .env junto a este archivo): ver .env.example
#   IMAGE_PREFIX  ej. ghcr.io/usuario/reservaya   (vacío → se construyen en local)
#   IMAGE_TAG     ej. latest
#   DOMAIN        ej. reservaya.ejemplo.com        (http://localhost para probar sin TLS)
#
# Demo pública (Mailpit expuesto en /mailpit, datos reiniciados cada noche):
#   DEMO_MODE=true  +  docker compose --profile demo ...
name: reservaya-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reservaya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-reservaya}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20

  # Aplica las migraciones pendientes y termina; el backend arranca solo si tuvo éxito
  migrate:
    image: ${IMAGE_PREFIX:-reservaya}/migrate:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migrate
    # El .env completo permite usar también esta imagen para el seed:
    #   docker compose -f docker-compose.prod.yml run --rm migrate npx prisma db seed
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-reservaya}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-reservaya}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  backend:
    image: ${IMAGE_PREFIX:-reservaya}/backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-reservaya}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-reservaya}
      CORS_ORIGIN: ${APP_URL}
      DEMO_MAIL_URL: ${DEMO_MAIL_URL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    image: ${IMAGE_PREFIX:-reservaya}/frontend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-http://localhost}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend

  # Solo en la demo pública: recibe todos los correos y los muestra en /mailpit
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    profiles: ['demo']
    environment:
      MP_WEBROOT: /mailpit/
      MP_MAX_MESSAGES: 500

volumes:
  db-data:
  caddy-data:
  caddy-config:
